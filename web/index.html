<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#fbfaf7" />
    <meta name="description" content="Simulador de asignación de cupos en colegios oficiales de Bogotá, con datos abiertos. Por Proliferante." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/png" href="./iconos/favicon.png" />
    <link rel="apple-touch-icon" href="./iconos/apple-touch-icon.png" />
    <title>Matrícula+ · ¿Dónde cabe cada niño?</title>
    <!--
      Esqueleto de carga: se ve desde el primer instante, antes de que llegue el JavaScript.
      React lo reemplaza al montar; mientras cargan los datos, App.tsx muestra el mismo esqueleto
      (reutiliza estas clases).
    -->
    <style>
      html, body { margin: 0; height: 100%; background: #fbfaf7; }
      .esq { position: fixed; inset: 0; display: flex; flex-direction: column; font-family: system-ui, sans-serif; color: #5f5c76; background: #fbfaf7; }
      .esq__cab { flex: none; height: 3.3rem; display: flex; align-items: center; gap: 0.8rem; padding: 0 1.1rem; border-bottom: 1px solid #e4e1ec; }
      .esq__cuerpo { flex: 1; min-height: 0; display: grid; grid-template-rows: 46fr 54fr; }
      .esq__mapa { position: relative; background: #f3f1f7; border-bottom: 1px solid #e4e1ec; overflow: hidden; display: grid; place-items: center; }
      .esq__ciudad { width: 34%; max-width: 15rem; aspect-ratio: 0.55; background: #e7e3f1; border-radius: 42% 58% 48% 52% / 30% 34% 66% 70%; }
      .esq__panel { padding: 1.4rem 1.1rem; display: flex; flex-direction: column; gap: 0.75rem; }
      .esq__b { border-radius: 0.4rem; background: #ebe8f1; position: relative; overflow: hidden; }
      .esq__b::after, .esq__ciudad::after { content: ''; position: absolute; inset: 0; transform: translateX(-100%);
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.7), transparent); animation: esq-brillo 1.4s ease-in-out infinite; }
      .esq__ciudad { position: relative; overflow: hidden; }
      .esq__estado { margin-top: auto; display: flex; align-items: center; gap: 0.6rem; font: 500 0.72rem ui-monospace, monospace; letter-spacing: 0.06em; text-transform: uppercase; }
      .esq__punto { width: 0.55rem; height: 0.55rem; border-radius: 50%; background: #7f45ee; animation: esq-latido 1s ease-in-out infinite; }
      .esq__fila { display: flex; gap: 0.5rem; }
      @keyframes esq-brillo { to { transform: translateX(100%); } }
      @keyframes esq-latido { 50% { opacity: 0.25; transform: scale(0.7); } }
      @media (min-width: 900px) and (orientation: landscape) {
        .esq__cuerpo { grid-template-rows: none; grid-template-columns: minmax(25rem, 31rem) 1fr; }
        .esq__panel { order: -1; border-right: 1px solid #e4e1ec; padding: 2rem; }
        .esq__mapa { border-bottom: 0; }
      }
      @media (prefers-reduced-motion: reduce) { .esq__b::after, .esq__ciudad::after, .esq__punto { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="esq" role="status" aria-label="Cargando Matrícula+">
        <div class="esq__cab"><div class="esq__b" style="width:6.4rem;height:1.2rem"></div><div class="esq__b" style="width:9rem;height:1.6rem;border-radius:99rem"></div></div>
        <div class="esq__cuerpo">
          <div class="esq__mapa"><div class="esq__ciudad"></div></div>
          <div class="esq__panel">
            <div class="esq__b" style="width:30%;height:0.7rem"></div>
            <div class="esq__b" style="width:85%;height:1.9rem"></div>
            <div class="esq__b" style="width:60%;height:1.9rem"></div>
            <div class="esq__b" style="width:95%;height:0.8rem;margin-top:0.4rem"></div>
            <div class="esq__b" style="width:80%;height:0.8rem"></div>
            <div class="esq__fila"><div class="esq__b" style="flex:1;height:3.2rem"></div><div class="esq__b" style="flex:1;height:3.2rem"></div><div class="esq__b" style="flex:1;height:3.2rem"></div></div>
            <div class="esq__estado"><span class="esq__punto"></span><span>Cargando Matrícula+…</span></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
